<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Concesionario</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container py-5">

    <!-- Título -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">🚗 Concesionario</h1>
        <a href="{% url 'crear_carro' %}" class="btn btn-success">
            + Agregar Carro
        </a>
    </div>

    <!-- Mensajes de Django -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- Grid de carros -->
    <div class="col-md-4 mb-4">
    <div class="card shadow-sm h-100 position-relative">

        <!-- Link invisible que cubre toda la card -->
        <a href="{% url 'ver_carro' carro.id %}" 
           class="stretched-link"></a>

        <div class="card-body">
            <h5 class="card-title">
                {{ carro.marca }} {{ carro.modelo }}
            </h5>

            <p class="card-text">
                <strong>Precio:</strong> ${{ carro.precio }}
            </p>

            <div class="mt-3">
                <a href="{% url 'editar_carro' carro.id %}" 
                   class="btn btn-warning btn-sm position-relative">
                    Editar
                </a>

                <a href="{% url 'eliminar_carro' carro.id %}" 
                   class="btn btn-danger btn-sm position-relative"
                   onclick="return confirm('¿Seguro que quieres eliminar?')">
                    Eliminar
                </a>
            </div>
        </div>
    </div>
</div>

        {% empty %}
            <div class="col-12">
                <div class="alert alert-info text-center">
                    No hay carros registrados todavía.
                </div>
            </div>
        {% endfor %}
    </div>

</div>

<!-- JS Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
