<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle Auto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #6a4c93, #8e7dbe);
            min-height: 100vh;
        }
        .card-custom {
            border-radius: 15px;
        }
        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #198754;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom shadow p-4 text-center">

                <h2 class="mb-3">🚘 Detalle del Carro</h2>

                <h4>{{ carro.marca }} {{ carro.modelo }}</h4>

                <p class="price mt-3">
                    ${{ carro.precio }}
                </p>

                <div class="mt-4">
                    <a href="{% url 'editar_carro' carro.id %}" class="btn btn-warning me-2">
                        Editar
                    </a>

                    <a href="{% url 'eliminar_carro' carro.id %}"
                       class="btn btn-danger me-2"
                       onclick="return confirm('¿Seguro que deseas eliminar este carro?')">
                        Eliminar
                    </a>

                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        Dashboard
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
