<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
</head>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #74ebd5 ;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .form-container {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        width: 350px;
        text-align: center;
    }

    .form-container h1 {
        margin-bottom: 20px;
        color: #333;
        font-size: 24px;
    }

    label {
        display: block;
        text-align: left;
        margin-bottom: 5px;
        font-weight: bold;
        color: #444;
    }

    input[type="email"],
    input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 5px rgba(108,99,255,0.5);
    }

    button {
        width: 100%;
        padding: 12px;
        background: #6c63ff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background: #5a52e0;
    }
</style>
<body>
    <div class="form-container">
        <h1>Iniciar Sesión</h1>
        <form method="POST">  # El formulario se envía a la misma URL para procesar el inicio de sesión
            {% csrf_token %} # Token de seguridad para proteger contra ataques CSRF
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required><br><br>
            <button type="submit">Iniciar Sesión</button>
        </form>
        {% if mensaje %} # Mostrar el mensaje de error si existe
            <p>{{ mensaje }}</p>
        {% endif %}
    </div>
</body>
</html>
