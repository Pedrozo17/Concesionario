<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1c1c1c, #2b2b2b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            width: 380px;
            text-align: center;
        }

        .form-container h2 {
            margin-bottom: 25px;
            color: #1c1c1c;
            font-weight: 700;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212,175,55,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1c1c1c;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: #d4af37;
            color: #1c1c1c;
        }

        p {
            margin-top: 15px;
            font-weight: 600;
            color: #2e7d32;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Registrate</h2>

        <form method="POST">
            {% csrf_token %}

            <label for="email">Correo electrónico</label>
            <input type="email" name="email" id="email" placeholder="Correo electrónico" required>

            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="Contraseña" required>

            <button type="submit">Registrarse</button>
        </form>

        {% if mensaje %}
            <p>{{ mensaje }}</p>
        {% endif %}
    </div>
</body>
</html>
