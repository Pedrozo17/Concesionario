<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Concesionario</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #1c1c1c, #2c2c2c);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f5f5f5;
        }

        h1 {
            color: #ffffff;
            letter-spacing: 1px;
        }

        .btn-success {
            background-color: #bfa046;
            border: none;
            font-weight: 600;
        }

        .btn-success:hover {
            background-color: #a88c3d;
        }

        .card {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .card-title {
            color: #d4af37;
            font-weight: 600;
        }

        .card-text {
            color: #ddd;
        }

        .btn-warning {
            background-color: #d4af37;
            border: none;
            color: #1c1c1c;
            font-weight: 600;
        }

        .btn-warning:hover {
            background-color: #c19b2c;
        }

        .btn-danger {
            background-color: #8b0000;
            border: none;
        }

        .alert {
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">🚗 Concesionario</h1>
        <a href="{% url 'crear_carro' %}" class="btn btn-success">
            + Agrega un carro
        </a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="row">
        {% for carro in carros %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm h-100 position-relative">

                <a href="{% url 'ver_carro' carro.id %}" class="stretched-link"></a>

                <div class="card-body">
                    <h5 class="card-title">
                        {{ carro.marca }} {{ carro.modelo }}
                    </h5>

                    <p class="card-text">
                        <strong>Precio:</strong> ${{ carro.precio }}
                    </p>

                    <div class="mt-3">
                        <a href="{% url 'editar_carro' carro.id %}" 
                           class="btn btn-warning btn-sm position-relative">
                            Editar
                        </a>

                        <a href="{% url 'eliminar_carro' carro.id %}" 
                           class="btn btn-danger btn-sm position-relative"
                           onclick="return confirm('¿Seguro que quieres eliminar?')">
                            Eliminar
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info text-center">
                    No hay carros registrados todavia.
                </div>
            </div>
        {% endfor %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
