<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Auto</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1c1c1c, #2b2b2b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1c1c1c;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212,175,55,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1c1c1c;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }

        button:hover {
            background: #d4af37;
            color: #1c1c1c;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            font-weight: 600;
            color: #1c1c1c;
        }

        a:hover {
            color: #d4af37;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Edita el carro</h2>

    <form method="POST">
        {% csrf_token %}

        Marca:
        <input type="text" name="marca" value="{{ carro.marca }}">

        Modelo:
        <input type="text" name="modelo" value="{{ carro.modelo }}">

        Precio:
        <input type="number" name="precio" value="{{ carro.precio }}">

        <button type="submit">Actualizar</button>
    </form>

    <a href="{% url 'ver_carro' carro.id %}">Cancelar</a>
</div>

</body>
</html>
