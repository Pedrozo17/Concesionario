<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Auto</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1c1c1c, #2b2b2b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #1c1c1c;
            font-weight: 700;
        }

        .info {
            margin-bottom: 20px;
            font-size: 16px;
            color: #444;
        }

        .price {
            font-size: 20px;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 25px;
        }

        a {
            display: block;
            margin: 10px 0;
            padding: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .edit {
            background: #1c1c1c;
            color: white;
        }

        .edit:hover {
            background: #d4af37;
            color: #1c1c1c;
        }

        .delete {
            background: #8b0000;
            color: white;
        }

        .delete:hover {
            background: #b22222;
        }

        .back {
            margin-top: 20px;
            color: #1c1c1c;
        }

        .back:hover {
            color: #d4af37;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Detalle carro</h2>

    <div class="info">
        Marca: {{ carro.marca }} <br>
        Modelo: {{ carro.modelo }}
    </div>

    <div class="price">
        Precio: ${{ carro.precio }}
    </div>

    <a href="{% url 'editar_carro' carro.id %}" class="edit">Editar</a>

    <a href="{% url 'eliminar_carro' carro.id %}" 
       onclick="return confirm('Seguro?')" 
       class="delete">
        Eliminar
    </a>

    <a href="{% url 'dashboard' %}" class="back">Dashboard</a>
</div>

</body>
</html>
